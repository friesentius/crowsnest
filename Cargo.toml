[package]
name = "crowsnest"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
description = "Read-only terminal dashboard for a firstmate fleet: workers, no-mistakes pipelines, PR checks, CI runners and host health"
repository = "https://github.com/friesentius/crowsnest"
readme = "README.md"
keywords = ["tui", "ratatui", "dashboard", "firstmate", "no-mistakes"]
categories = ["command-line-utilities"]

[dependencies]
clap = { version = "4.6", features = ["derive", "env"] }
libc = "0.2"
ratatui = "0.30.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = { version = "0.40", default-features = false, features = ["system", "disk"] }
unicode-width = "0.2"

[dev-dependencies]
insta = "1.49"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
